name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Contrast check
        run: npm run check:contrast

      - name: Contact API, rate-limiter and metadata unit tests
        # In-process route-handler tests with a mocked fetch: no browser or
        # server needed (E2E_BASE_URL stops Playwright starting servers).
        run: npx playwright test tests/contact-api.spec.ts tests/rate-limit.spec.ts tests/verification.spec.ts
        env:
          E2E_BASE_URL: http://127.0.0.1:9

      - name: Build
        run: npm run build

      - name: Check build output for source maps and secrets
        run: |
          if find .next/static -name '*.map' | grep -q .; then
            echo "::error::Public source maps were generated in .next/static"; exit 1
          fi
          if grep -rlE 're_[A-Za-z0-9]{20,}|UPSTASH_REDIS_REST_TOKEN|KV_REST_API_TOKEN|RESEND_API_KEY|gmail\.com' .next/static; then
            echo "::error::A secret name, key or personal email appears in client bundles"; exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (full suite)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
